# documentation: https://github.com/get-convex/convex-backend/blob/main/self-hosted/README.md
# slogan: Self-hosted Convex with Postgres (database) + RustFS (S3 file storage) + automated off-site backups.
# category: backend
# tags: convex, database, reactive, postgres, s3, rustfs, backups
# port: 6791
#
# Coolify magic variables used (auto-generated by Coolify on first deploy):
#   SERVICE_URL_BACKEND_3210   -> FQDN for the Convex API        (e.g. https://convex-api.example.com)
#   SERVICE_URL_SITE_3211      -> FQDN for Convex HTTP actions   (e.g. https://convex-site.example.com)
#   SERVICE_URL_DASHBOARD_6791 -> FQDN for the Convex dashboard  (e.g. https://convex-dash.example.com)
#   SERVICE_URL_RUSTFS_9000    -> FQDN for the RustFS S3 API     (e.g. https://s3.example.com)(optional public exposure)
#   SERVICE_URL_CONSOLE_9001   -> FQDN for the RustFS console    (e.g. https://s3-console.example.com)(optional public exposure)
#   SERVICE_HEX_64_SECRET      -> Convex instance secret
#   SERVICE_USER_POSTGRES / SERVICE_PASSWORD_POSTGRES
#   SERVICE_USER_RUSTFS  / SERVICE_PASSWORD_RUSTFS

services:
  # ──────────────────────────────────────────────────────────────
  # PostgreSQL — Convex system-of-record (replaces embedded SQLite)
  # ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      # Convex creates its own database named after INSTANCE_NAME
      # (dashes replaced with underscores), so we pre-create it here.
      - POSTGRES_DB=${CONVEX_DB_NAME:-self_hosted_convex}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────
  # RustFS — S3-compatible object storage for Convex file storage,
  # exports, modules and search indexes
  # ──────────────────────────────────────────────────────────────
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.4
    command: /data
    environment:
      - SERVICE_URL_RUSTFS_9000
      - SERVICE_URL_CONSOLE_9001
      - RUSTFS_ADDRESS=${RUSTFS_ADDRESS:-0.0.0.0:9000}
      - RUSTFS_CONSOLE_ADDRESS=${RUSTFS_CONSOLE_ADDRESS:-0.0.0.0:9001}
      - RUSTFS_ACCESS_KEY=${SERVICE_USER_RUSTFS}
      - RUSTFS_SECRET_KEY=${SERVICE_PASSWORD_RUSTFS}
      - RUSTFS_CONSOLE_ENABLE=${RUSTFS_CONSOLE_ENABLE:-true}
      - RUSTFS_CORS_ALLOWED_ORIGINS=${RUSTFS_CORS_ALLOWED_ORIGINS:-*}
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=${RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 20s
      retries: 10

  # ──────────────────────────────────────────────────────────────
  # One-shot init job — creates the 5 buckets Convex needs in RustFS
  # ──────────────────────────────────────────────────────────────
  rustfs-init:
    image: amazon/aws-cli:2.36.34
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"
    environment:
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_RUSTFS}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_RUSTFS}
      - AWS_REGION=${RUSTFS_REGION:-us-east-1}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        for b in convex-snapshot-exports convex-snapshot-imports convex-modules convex-user-files convex-search-indexes; do
          aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket $$b 2>/dev/null || true
          echo "bucket $$b ready"
        done

  # ──────────────────────────────────────────────────────────────
  # Convex backend
  # ──────────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/get-convex/convex-backend:precompiled-2026-08-29-1733af0
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    volumes:
      - convex-data:/convex/data
    environment:
      - SERVICE_URL_BACKEND_3210
      - SERVICE_URL_SITE_3211
      - INSTANCE_NAME=${INSTANCE_NAME:-self-hosted-convex}
      - INSTANCE_SECRET=${SERVICE_HEX_64_SECRET}
      - CONVEX_RELEASE_VERSION_DEV=${CONVEX_RELEASE_VERSION_DEV:-}
      - ACTIONS_USER_TIMEOUT_SECS=${ACTIONS_USER_TIMEOUT_SECS:-}
      # URL of the Convex API as accessed by the client/frontend.
      - CONVEX_CLOUD_ORIGIN=${SERVICE_URL_BACKEND}
      # URL of Convex HTTP actions as accessed by the client/frontend.
      - CONVEX_SITE_ORIGIN=${SERVICE_URL_SITE}
      - DISABLE_BEACON=${DISABLE_BEACON:-true}
      - REDACT_LOGS_TO_CLIENT=${REDACT_LOGS_TO_CLIENT:-false}
      # Postgres is on the internal Docker network -> no SSL needed.
      - DO_NOT_REQUIRE_SSL=${DO_NOT_REQUIRE_SSL:-true}
      # IMPORTANT: no database name in the URL — Convex derives it
      # from INSTANCE_NAME (dashes become underscores).
      - POSTGRES_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=${RUST_BACKTRACE:-}
      # ── S3 storage on RustFS ──
      - AWS_REGION=${RUSTFS_REGION:-us-east-1}
      - AWS_ACCESS_KEY_ID=${SERVICE_USER_RUSTFS}
      - AWS_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_RUSTFS}
      - AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-true}
      - AWS_S3_DISABLE_SSE=${AWS_S3_DISABLE_SSE:-true}
      - AWS_S3_DISABLE_CHECKSUMS=${AWS_S3_DISABLE_CHECKSUMS:-true}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://rustfs:9000}
      - S3_STORAGE_EXPORTS_BUCKET=${S3_STORAGE_EXPORTS_BUCKET:-convex-snapshot-exports}
      - S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET=${S3_STORAGE_SNAPSHOT_IMPORTS_BUCKET:-convex-snapshot-imports}
      - S3_STORAGE_MODULES_BUCKET=${S3_STORAGE_MODULES_BUCKET:-convex-modules}
      - S3_STORAGE_FILES_BUCKET=${S3_STORAGE_FILES_BUCKET:-convex-user-files}
      - S3_STORAGE_SEARCH_BUCKET=${S3_STORAGE_SEARCH_BUCKET:-convex-search-indexes}
    healthcheck:
      test: curl -f http://127.0.0.1:3210/version
      interval: 5s
      start_period: 10s

  # ──────────────────────────────────────────────────────────────
  # Convex dashboard
  # ──────────────────────────────────────────────────────────────
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:precompiled-2026-08-29-1733af0
    environment:
      - SERVICE_URL_DASHBOARD_6791
      # URL of the Convex API as accessed by the dashboard (browser).
      - NEXT_PUBLIC_DEPLOYMENT_URL=${SERVICE_URL_BACKEND}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: curl -f http://127.0.0.1:6791/
      interval: 5s
      start_period: 5s

  # ──────────────────────────────────────────────────────────────
  # Off-site backups -> external AWS S3 or Cloudflare R2
  # https://github.com/orenaksakal/convex-self-hosted-backups
  # ──────────────────────────────────────────────────────────────
  backups:
    build:
      # Pinned to a commit so deploys are reproducible (was an unpinned `main`).
      context: https://github.com/orenaksakal/convex-self-hosted-backups.git#41e70aa21bee0b4beba6a6be36f6bb79912d9519
    depends_on:
      backend:
        condition: service_healthy
    # `unless-stopped` + a misconfigured target = crash loop, and Coolify counts every
    # crash of ANY container against the app's max_restart_count, then stops the whole
    # stack (Convex included). So: no auto-restart, and exit 0 when no target is set.
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$AWS_S3_BUCKET" ] || [ -z "$$AWS_ACCESS_KEY_ID" ]; then
          echo "[backups] no external S3 target configured (BACKUP_S3_BUCKET / BACKUP_AWS_ACCESS_KEY_ID empty) — backups disabled, exiting cleanly."
          exit 0
        fi
        exec node dist/index.js
    environment:
      # Talk to the backend over the internal network.
      - CONVEX_SELF_HOSTED_URL=${BACKUP_CONVEX_URL:-http://backend:3210}
      # Generate with: docker compose exec backend ./generate_admin_key.sh
      - CONVEX_SELF_HOSTED_ADMIN_KEY=${CONVEX_SELF_HOSTED_ADMIN_KEY}
      # ── External backup target (AWS S3 or Cloudflare R2 — NOT RustFS) ──
      - AWS_ACCESS_KEY_ID=${BACKUP_AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${BACKUP_AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${BACKUP_S3_BUCKET}
      - AWS_S3_REGION=${BACKUP_S3_REGION:-auto}
      # For R2: https://<ACCOUNT_ID>.r2.cloudflarestorage.com — leave empty for AWS S3.
      - AWS_S3_ENDPOINT=${BACKUP_S3_ENDPOINT:-}
      - AWS_S3_FORCE_PATH_STYLE=${BACKUP_S3_FORCE_PATH_STYLE:-false}
      # ── Backup behaviour ──
      - BACKUP_FILE_PREFIX=${BACKUP_FILE_PREFIX:-backup}
      - BUCKET_SUBFOLDER=${BUCKET_SUBFOLDER:-}
      - INCLUDE_FILE_STORAGE=${INCLUDE_FILE_STORAGE:-true}
      - RUN_ON_STARTUP=${RUN_ON_STARTUP:-true}
      - MAX_HOURLY_BACKUPS=${MAX_HOURLY_BACKUPS:-24}
      - MAX_DAILY_BACKUPS=${MAX_DAILY_BACKUPS:-7}
      - MAX_WEEKLY_BACKUPS=${MAX_WEEKLY_BACKUPS:-4}
      - MAX_MONTHLY_BACKUPS=${MAX_MONTHLY_BACKUPS:-12}
      - BACKUP_MAX_RETRIES=${BACKUP_MAX_RETRIES:-1}
      - BACKUP_RETRY_DELAY_MS=${BACKUP_RETRY_DELAY_MS:-300000}
      # Optional failure notifications (Telegram/Discord/Slack via shoutrrr)
      - SHOUTRRR_URL=${SHOUTRRR_URL:-}

  # ──────────────────────────────────────────────────────────────
  # Export cleanup — prunes leftover export zips inside the Convex
  # data volume once a day (they accumulate after every backup run)
  # ──────────────────────────────────────────────────────────────
  export-cleanup:
    image: alpine:3.22
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - convex-data:/convex/data
    entrypoint: /bin/sh
    command: -c 'while true; do rm -f /convex/data/storage/exports/*; echo "$(date) - Cleaned exports"; sleep 86400; done'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "true"]
      interval: 30s

volumes:
  postgres-data:
  rustfs-data:
  convex-data: